
name: Daymark Build Check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Daymark
        run: npm run build
      
      - name: Inspect build output
        if: success()
        run: |
          echo "=== HTML entry files ==="
          find . -maxdepth 5 -type f -name "index.html" -not -path "./node_modules/*" -not -path "./.git/*"
          echo "=== Build output directories ==="
          for d in dist .output/public .vercel/output/public; do
            if [ -d "$d" ]; then
              echo "FOUND: $d"
              ls -la "$d" | head -30
            fi
          done

      - name: Find generated build files
        if: success()
        run: |
          echo "=== Build folders ==="
          find . -maxdepth 4 -type d \( -name .vercel -o -name .output -o -name dist -o -name server \) -not -path "./node_modules/*" -not -path "./.git/*"
          echo "=== Generated entry files ==="
          find . -maxdepth 6 -type f \( -name index.html -o -name config.json -o -name index.mjs -o -name nitro.json \) -not -path "./node_modules/*" -not -path "./.git/*" | head -100
